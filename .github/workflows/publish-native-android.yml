name: Publish tested native Android build

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful native Android candidate run to release
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.source_run }}
      OPENCODE_VERSION: "2.1.3"
      RELEASE_TAG: "v2.1.3-bun144.1"
      ASSET: "opencode-2.1.3-android-aarch64-source-bun144-sourcegraph"
    steps:
      - name: Fetch release workflow commit without broken submodules
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --depth=20 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Confirm tested build provenance
        run: |
          set -euo pipefail
          case "$SOURCE_RUN" in ''|*[!0-9]*) echo 'source_run must be a numeric Actions run ID' >&2; exit 1 ;; esac
          META="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN")"
          test "$(jq -r .conclusion <<<"$META")" = success
          test "$(jq -r .name <<<"$META")" = 'Build locked OpenCode v2 for native Android'
          test "$(jq -r .event <<<"$META")" = workflow_dispatch
          SOURCE_SHA="$(jq -r .head_sha <<<"$META")"
          test "${#SOURCE_SHA}" -eq 40
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          git diff --quiet "$SOURCE_SHA" HEAD -- \
            .github/workflows/build-native-android.yml \
            scripts/ci/build-opencode-source-bun144-sourcegraph.sh \
            tools/transplant \
            tools/patch-opencode-source-bun140.py \
            tools/patch-opentui-0.6.6.py \
            tools/remap-binary-prefix.py \
            tools/supply-chain-lock.json \
            patches/opentui

      - name: Download and verify the successful CI artifact
        run: |
          set -euo pipefail
          mkdir dist
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "opencode-$OPENCODE_VERSION-android-aarch64-source-bun144-sourcegraph-candidate" --dir dist
          (cd dist && sha256sum -c SHA256SUMS)
          test "$(awk -v name="$ASSET" '$2 == name && length($1) == 64 { count++ } END { print count+0 }' dist/SHA256SUMS)" -eq 1
          file "dist/$ASSET" | grep -q 'ARM aarch64'
          grep -aFq "raw/$RELEASE_TAG/install.sh" "dist/$ASSET"
          python3 - <<'PY'
          import json
          from pathlib import Path

          version = "2.1.3"
          variant = json.loads(Path("dist/build-variant.json").read_text())
          lock = json.loads(Path("dist/supply-chain-lock.json").read_text())
          report = json.loads(Path("dist/transplant-report.json").read_text())
          assert variant["candidate"] == "diagnostic-only", variant
          assert variant["android_runtime"] == "1.4.4 aarch64 Bionic", variant
          assert variant["bytecode"] is False, variant
          assert variant["termux_release_tag"] == "v2.1.3-bun144.1", variant
          assert variant["opencode_commit"] == lock["opencode"][version]["commit"], variant
          assert report["ver"] == version, report
          assert report["prediction"]["verdict"] == "OK", report
          assert report["prediction"]["base"] == "1.4.4", report
          assert report["steps"]["detect"]["module_count"] == 620, report
          assert report["steps"]["revive"]["status"] == "ok", report
          assert report["steps"]["swap"]["status"] == "ok", report
          assert report["steps"]["tui_probe"]["verdict"] == "skipped(no-aarch64)", report
          PY

      - name: Make bandwidth-saving archive
        run: |
          set -euo pipefail
          tar -C dist -czf "dist/$ASSET.tar.gz" "$ASSET"
          (cd dist && sha256sum "$ASSET.tar.gz" >> SHA256SUMS)

      - name: Publish release from CI
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "dist/$ASSET.tar.gz" dist/SHA256SUMS dist/supply-chain-lock.json \
            dist/transplant-report.json dist/build-variant.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'OpenCode 2.1.3 native Termux (Bun 1.4.4)' \
            --notes-file RELEASE_NOTES.md \
            --latest

      - name: Mark the previous release as the rollback build
        run: |
          set -euo pipefail
          gh release view v2.1.3 --repo "$GITHUB_REPOSITORY" --json body --jq .body \
            > dist/v2.1.3-original-notes.md
          {
            cat <<'EOF'
          > **Rollback build:** This Bun 1.4.0 release is retained for rollback from the latest [Bun 1.4.4 release](https://github.com/murafdev/opencode-termux/releases/tag/v2.1.3-bun144.1).
          > Reinstall it in Termux with `curl -fsSL https://github.com/murafdev/opencode-termux/raw/v2.1.3/install.sh | sh`.

          ---

          EOF
            cat dist/v2.1.3-original-notes.md
          } > dist/v2.1.3-rollback-notes.md
          gh release edit v2.1.3 \
            --repo "$GITHUB_REPOSITORY" \
            --title 'OpenCode 2.1.3 native Termux (Bun 1.4.0 rollback)' \
            --notes-file dist/v2.1.3-rollback-notes.md
